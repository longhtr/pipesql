[package]
name = "pipesql"
version.workspace = true
edition = "2024"
rust-version = "1.98.1"
license = "Unlicense"
publish = false
autotests = false

[workspace]
members = ["checksum", "filesystem", "dev", "dev/native", "dev/driver"]
default-members = [".", "checksum", "filesystem"]
resolver = "3"

[workspace.package]
version = "0.1.0"

[dependencies]
pipesql-checksum = { path = "checksum" }
pipesql-filesystem = { path = "filesystem" }
# CLI native startup boundary; same pinned ABI dependency as filesystem.
libc = "=0.2.186"

[dev-dependencies]
# Native stack observation is absent from ordinary library/CLI builds.
pipesql-filesystem = { path = "filesystem", features = ["test-stack-observation"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "pipesql"
path = "src/main.rs"

[[test]]
name = "public"
path = "test/public.rs"

[[test]]
name = "execution"
path = "test/execution.rs"

[[test]]
name = "lifecycle"
path = "test/lifecycle.rs"

[[test]]
name = "load"
path = "test/load.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
correctness = "deny"

[profile.release]
debug = true
